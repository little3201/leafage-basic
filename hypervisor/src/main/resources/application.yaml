server:
  port: 8762

spring:
  application:
    name: hypervisor
  profiles:
    active: dev

  jpa:
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8761
  aop:
    proxy-target-class: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}